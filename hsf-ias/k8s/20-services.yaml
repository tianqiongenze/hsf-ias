#   ADR-026 + INTROSPECTION env R-27 + verifyJwt RS256 支持 R-31）、iam 1.0.2→1.0.3（issue_token
#   JWT_ALG 开关 R-31）、ratelimit 2.0→2.0.1（RATE_MODE2 滑窗可选 R-25）、uplink 3.0.5→3.0.6
#   （payload geoWkt/schemaVersion 1.2 R-24）；iot/rs/sim tag 不动（R-31 验签代码已入工作区，
