# 阶段 0 安全止血 patch（2026-11-14，docs/24 R-06/R-07/R-08）：iam 1.0.1→1.0.2、facility 1.0.1→1.0.2
#   （SM4 fail-closed + JWT TTL 2h + JWT_SECRET 回退消除）、gw 3.0.2→3.0.3（JWT_SECRET 回退消除）；
