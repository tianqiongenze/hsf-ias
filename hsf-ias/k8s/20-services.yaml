# HSF 应用层：网关 + 四 GraphQL 子图 + sim(REST) + web（命名空间 hsf-prod）
# 逐项冻结依据：hsf/docs/06 §8.2 工作负载与资源清单（部署冻结源）、CONVENTIONS §1/§2.5/§2.14/§2.15/§2.16
# 上线前核验：ss -tln 确认 NodePort 未被占用，冲突则顺延并记录（CONVENTIONS §1）
# 实际记录（2026-11-07 部署）：原 gw NodePort 30090 被跨租户 dify-plus/redis8-node-0 占用
# （ss 不可见、仅集群分配表可见），按 §1 顺延为 30099；sim=31211、web=31210 无冲突保留。
# hsf-dev 同构部署：副本减半 + sed 's/hsf-prod/hsf-dev/g' 后另行 apply（本文件只冻结 prod）
# 镜像统一来自集群私有仓库 10.167.2.175:30500/hsf/*
---
# ─── gw：Apollo 网关，业务 8090(GraphQL) + 探针 9090(/healthz；8090 是 GraphQL，/healthz 会 400——CONVENTIONS §2.5) ───
apiVersion: apps/v1
kind: Deployment
metadata: {name: gw, namespace: hsf-prod, labels: {app: gw}}
spec:
  replicas: 2
  selector: {matchLabels: {app: gw}}
  template:
    metadata: {labels: {app: gw}}
    spec:
      priorityClassName: hsf-critical
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app: gw}}}
      containers:
      - name: gw
        image: 10.167.2.175:30500/hsf/gw:1.1.2
        ports: [{containerPort: 8090}, {containerPort: 9090}]
        env:
        - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: hsf-secrets, key: JWT_SECRET}}}
        - {name: RATE_CAP, value: "1200"}
        - name: SUBGRAPHS
          value: "iam=http://iam-svc.hsf-prod.svc.cluster.local:8091/graphql,land=http://land-svc.hsf-prod.svc.cluster.local:8092/graphql,project=http://project-svc.hsf-prod.svc.cluster.local:8093/graphql,facility=http://facility-svc.hsf-prod.svc.cluster.local:8094/graphql"
        - {name: RATE_CAP, value: "6000"}   # 令牌桶 6000/min，按 user.sub 或 ip 分桶（CONVENTIONS §2.6）
        resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {cpu: "2", memory: 1Gi}}
        readinessProbe: {httpGet: {path: /healthz, port: 9090}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: 9090}, initialDelaySeconds: 60, periodSeconds: 10}
---
# 注：gw-svc 不带 metrics:"true" label——Node 网关进程无 /metrics 端点（CONVENTIONS §2.16 例外），
#     避免被 ServiceMonitor 选中后 target 永远 DOWN；端口名仍为 http-metrics 以统一口径。
apiVersion: v1
kind: Service
metadata: {name: gw-svc, namespace: hsf-prod, labels: {app: gw-svc}}
spec:
  type: NodePort
  selector: {app: gw}
  ports: [{name: http-metrics, port: 8090, targetPort: 8090, nodePort: 30099}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: gw-hpa, namespace: hsf-prod}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gw}
  minReplicas: 4
  maxReplicas: 6
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
---
# ─── iam：组织/账号/登录（联邦实体 Party 拥有者；种子幂等双守卫）───
apiVersion: apps/v1
kind: Deployment
metadata: {name: iam-svc, namespace: hsf-prod, labels: {app: iam-svc}}
spec:
  replicas: 2
  selector: {matchLabels: {app: iam-svc}}
  template:
    metadata: {labels: {app: iam-svc}}
    spec:
      priorityClassName: hsf-normal
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app: iam-svc}}}
      containers:
      - name: app
        image: 10.167.2.175:30500/hsf/iam:1.0.1
        ports: [{containerPort: 8091}]
        envFrom: [{secretRef: {name: hsf-secrets}}]
        resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
        readinessProbe: {httpGet: {path: /readyz, port: 8091}, periodSeconds: 5, failureThreshold: 3}
        livenessProbe: {httpGet: {path: /healthz, port: 8091}, initialDelaySeconds: 20, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: iam-svc, namespace: hsf-prod, labels: {app: iam-svc, metrics: "true"}}
spec: {selector: {app: iam-svc}, ports: [{name: http-metrics, port: 8091, targetPort: 8091}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: iam-hpa, namespace: hsf-prod}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: iam-svc}
  minReplicas: 2
  maxReplicas: 4
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}}]
---
