# 注：web-svc 不带 metrics:"true" label——nginx 纯静态无 /metrics 端点（CONVENTIONS §2.16 同 gw 例外的
#     同一逻辑），带 label 会被 ServiceMonitor 选中致 target 永远 DOWN，破坏"targets 全 UP"验收。
apiVersion: v1
kind: Service
metadata: {name: web-svc, namespace: hsf-prod, labels: {app: web-svc}}
spec:
  type: NodePort
  selector: {app: web}
  ports: [{name: http-metrics, port: 80, targetPort: 80, nodePort: 31210}]
---
# ─── ratelimit-svc（二期新增）：全局固定窗口限流（:8096，ClusterIP）───
# 判定：Redis Cluster Lua 原子 INCRBY(cost)+条件 EXPIRE(120)，键 hsf:rl:{key}:{分钟epoch}
# （docs/07 §5.1 / CONVENTIONS-P2 T-2 冻结；gw 经 env RATE_SVC HTTP 调用，本服务不可用时 gw fail-open）
apiVersion: apps/v1
kind: Deployment
metadata: {name: ratelimit-svc, namespace: hsf-prod, labels: {app: ratelimit-svc}}
spec:
  replicas: 2
  selector: {matchLabels: {app: ratelimit-svc}}
  template:
    metadata: {labels: {app: ratelimit-svc}}
    spec:
      priorityClassName: hsf-normal
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app: ratelimit-svc}}}
      containers:
      - name: app
        image: 10.167.2.175:30500/hsf/ratelimit:2.0
        ports: [{containerPort: 8096}]
        envFrom: [{secretRef: {name: hsf-secrets}}]   # REDIS_URL/REDIS_PASS（hsf-redis 集群，infra）
        env:
        # 窗口容量 req/min/键：docs/07 §5.1/§9-③ 二期冻结 1200——1500 突发必触发 429（§5.4 验证口径）
        - {name: RATE_CAP, value: "1200"}
        resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
        readinessProbe: {httpGet: {path: /readyz, port: 8096}, periodSeconds: 5, failureThreshold: 3}
        livenessProbe: {httpGet: {path: /healthz, port: 8096}, initialDelaySeconds: 20, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: ratelimit-svc, namespace: hsf-prod, labels: {app: ratelimit-svc, metrics: "true"}}
spec: {selector: {app: ratelimit-svc}, ports: [{name: http-metrics, port: 8096, targetPort: 8096}]}
---
# ─── iot-svc（二期新增）：MQTT 订阅接入 + TimescaleDB 批量写 + 规则引擎/灌溉决策/通知（:8097，NodePort 31213）───
# 单副本冻结（docs/07 §1.2，禁 HPA）：paho-mqtt 订阅为独立消费（MQTT 无共享消费组语义），
# 多副本将对同一 topic 重复入库双写时序；T-3 端口分配 iot=31213（上线前 ss -tln 核验）
apiVersion: apps/v1
kind: Deployment
metadata: {name: iot-svc, namespace: hsf-prod, labels: {app: iot-svc}}
spec:
  replicas: 1
  selector: {matchLabels: {app: iot-svc}}
  template:
    metadata: {labels: {app: iot-svc}}
    spec:
      priorityClassName: hsf-normal
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app: iot-svc}}}
      containers:
      - name: app
        image: 10.167.2.175:30500/hsf/iot:3.0.5
        ports: [{containerPort: 8097}]
        envFrom: [{secretRef: {name: hsf-secrets}}]   # DB_*/REDIS_*/MQTT_PASS/TIMESCALE_PASS 全量注入（§1.4）
        env:
        # 显式列出二期键（§1.4 冻结）：MQTT user=hsf@hsf-mqtt:1883；TIMESCALE_PASS 为三方共用密码键
        - {name: MQTT_PASS, valueFrom: {secretKeyRef: {name: hsf-secrets, key: MQTT_PASS}}}
        - {name: TIMESCALE_PASS, valueFrom: {secretKeyRef: {name: hsf-secrets, key: TIMESCALE_PASS}}}
        # TimescaleDB 连接串（§1.4 冻结形态）：密码引用上方 TIMESCALE_PASS（$(VAR) 仅展开先前显式 env；
        # envFrom 键不参与展开）。短名同命名空间解析，hsf-dev 同构 sed 派生无需替换
        - {name: TIMESCALE_DSN, value: "postgresql://hsf:$(TIMESCALE_PASS)@hsf-timescale:5432/hsf_ts"}
        resources: {requests: {cpu: 250m, memory: 384Mi}, limits: {cpu: "2", memory: 1Gi}}
        readinessProbe: {httpGet: {path: /readyz, port: 8097}, periodSeconds: 5, failureThreshold: 3}
        livenessProbe: {httpGet: {path: /healthz, port: 8097}, initialDelaySeconds: 20, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: iot-svc, namespace: hsf-prod, labels: {app: iot-svc, metrics: "true"}}
spec:
  type: NodePort
  selector: {app: iot-svc}
  ports: [{name: http-metrics, port: 8097, targetPort: 8097, nodePort: 31213}]
---
