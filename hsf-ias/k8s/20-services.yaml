# ─── sim：IoT 模拟/时序/告警（REST 非 GraphQL，D-05-3；单副本为 tick 节奏幂等前提——06 号 §8.2）───
apiVersion: apps/v1
kind: Deployment
metadata: {name: sim-svc, namespace: hsf-prod, labels: {app: sim-svc}}
spec:
  replicas: 1
  selector: {matchLabels: {app: sim-svc}}
  template:
    metadata: {labels: {app: sim-svc}}
    spec:
      priorityClassName: hsf-batch
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app: sim-svc}}}
      containers:
      - name: app
        image: 10.167.2.175:30500/hsf/sim:3.0
        ports: [{containerPort: 8095}]
        envFrom: [{secretRef: {name: hsf-secrets}}]
        env:
        # 二期 MQTT 发布者（T-2）：密码经 hsf-secrets 注入（user hsf@hsf-mqtt:1883，docs/07 §1.4）。
        # sim 2.0 不连 TimescaleDB（时序写职责移交 iot，docs/07 §9-④⑤），故无 TIMESCALE_* env
        - {name: MQTT_PASS, valueFrom: {secretKeyRef: {name: hsf-secrets, key: MQTT_PASS}}}
        resources: {requests: {cpu: 250m, memory: 384Mi}, limits: {cpu: "2", memory: 1Gi}}
