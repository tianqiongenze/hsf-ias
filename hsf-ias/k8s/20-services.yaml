spec:
  type: NodePort
  selector: {app: sim-svc}
  ports: [{name: http-metrics, port: 8095, targetPort: 8095, nodePort: 31211}]
---
# ─── web：纯静态前端（禁 CDN，SVG 一张图回退——CONVENTIONS §2.12）───
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: hsf-prod, labels: {app: web}}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      priorityClassName: hsf-normal
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app: web}}}
      containers:
      - name: app
        image: 10.167.2.175:30500/hsf/web:1.0
        ports: [{containerPort: 80}]
        resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
        readinessProbe: {httpGet: {path: /, port: 80}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /, port: 80}, initialDelaySeconds: 20, periodSeconds: 10}
---
# 注：web-svc 不带 metrics:"true" label——nginx 纯静态无 /metrics 端点（CONVENTIONS §2.16 同 gw 例外的
#     同一逻辑），带 label 会被 ServiceMonitor 选中致 target 永远 DOWN，破坏"targets 全 UP"验收。
apiVersion: v1
kind: Service
metadata: {name: web-svc, namespace: hsf-prod, labels: {app: web-svc}}
spec:
  type: NodePort
  selector: {app: web}
  ports: [{name: http-metrics, port: 80, targetPort: 80, nodePort: 31210}]
