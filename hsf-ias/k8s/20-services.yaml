# ─── sim：IoT 模拟/时序/告警（REST 非 GraphQL，D-05-3；单副本为 tick 节奏幂等前提——06 号 §8.2）───
apiVersion: apps/v1
kind: Deployment
metadata: {name: sim-svc, namespace: hsf-prod, labels: {app: sim-svc}}
spec:
  replicas: 1
  selector: {matchLabels: {app: sim-svc}}
  template:
    metadata: {labels: {app: sim-svc}}
    spec:
      priorityClassName: hsf-batch
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app: sim-svc}}}
      containers:
      - name: app
        # 2026-11-15 部署窗口：R-02 发布侧指标（mqtt_pub 队列/rc 计数）+R-31 decode_token——3.0→3.0.6
        image: 10.167.2.175:30500/hsf/sim:3.0.8
        ports: [{containerPort: 8095}]
        envFrom: [{secretRef: {name: hsf-secrets}}]
        env:
        # 二期 MQTT 发布者（T-2）：密码经 hsf-secrets 注入（docs/07 §1.4）。
        # R-20/ADR-HSF-018（2026-11-14）：分账号最小授权——sim 发布账号 hsf-sim（仅
        # topic write hsf/sensor/#，MQTT_PASS_SIM 键）；MQTT_USER env 支持为二期既有实现
        # （services/sim/app/main.py:40）。sim 2.0 不连 TimescaleDB（时序写职责移交 iot，
        # docs/07 §9-④⑤），故无 TIMESCALE_* env
        - {name: MQTT_USER, value: "hsf-sim"}
        - {name: MQTT_PASS, valueFrom: {secretKeyRef: {name: hsf-secrets, key: MQTT_PASS_SIM}}}
        # v1.1 异步化调优（ADR-HSF-028 + docs/25 §11）：并发 job worker——recorded_at 全局
        # 有序由 MONO.next_batch 槽位隔离保证，SIM_JOB_WORKERS=4 解除 JobManager 单 worker
        # 串行瓶颈（发布池 11k/s 能力与队列供给匹配）
        - {name: SIM_JOB_WORKERS, value: "4"}
        resources: {requests: {cpu: 250m, memory: 384Mi}, limits: {cpu: "2", memory: 1Gi}}
        readinessProbe: {httpGet: {path: /readyz, port: 8095}, periodSeconds: 5, failureThreshold: 3}
        livenessProbe: {httpGet: {path: /healthz, port: 8095}, initialDelaySeconds: 20, periodSeconds: 10}
