# gw 限流判定移至 ratelimit-svc（env RATE_SVC，进程内桶删除）；sim/iot 增 MQTT_PASS/TIMESCALE_DSN
# 逐项冻结依据：hsf/docs/06 §8.2 工作负载与资源清单（部署冻结源）、CONVENTIONS §1/§2.5/§2.14/§2.15/§2.16
