---
# ─── gw：Apollo 网关，业务 8090(GraphQL) + 探针 9090(/healthz；8090 是 GraphQL，/healthz 会 400——CONVENTIONS §2.5) ───
apiVersion: apps/v1
kind: Deployment
metadata: {name: gw, namespace: hsf-prod, labels: {app: gw}}
spec:
  replicas: 2
  selector: {matchLabels: {app: gw}}
  template:
    metadata: {labels: {app: gw}}
    spec:
      priorityClassName: hsf-critical
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app: gw}}}
      containers:
      - name: gw
        # R-26/R-27/R-31（2026-11-14）：查询深度护栏+INTROSPECTION env+RS256 验签支持——3.0.3→3.0.4 patch；
        # 2026-11-15 部署窗口（dockerd 恢复后统一收口）：3.0.4 曾受 docs/22 §10 构建阻塞未入库，
        # 本窗口 TAG=3.0.6 SVCS 构建推送后顺延 3.0.4→3.0.6（同窗口 iot/sim/rs patch 对齐）
        image: 10.167.2.175:30500/hsf/gw:3.0.6
        ports: [{containerPort: 8090}, {containerPort: 9090}]
        env:
        - {name: JWT_SECRET, valueFrom: {secretKeyRef: {name: hsf-secrets, key: JWT_SECRET}}}
        # R-31（2026-11-14，ADR-HSF-027）：JWT 验签密钥族——JWT_ALG=HS256 默认（冻结兼容开关，
        # 切 RS256 仅改 Secret 该键值并滚动）；JWT_PUBLIC_KEY/PREV=验签公钥（base64(PEM) 单行，
        # gen-secrets.sh RSA-2048 生成）；JWT_KID(_PREV)=令牌头 kid 选择（轮换窗口双公钥）。
        # HS256 模式下本组 env 不生效（verifyJwt 走 JWT_SECRET 冻结路径）；私钥不注入 gw（最小授权）
        - {name: JWT_ALG, valueFrom: {secretKeyRef: {name: hsf-secrets, key: JWT_ALG}}}
        - {name: JWT_KID, valueFrom: {secretKeyRef: {name: hsf-secrets, key: JWT_KID}}}
        - {name: JWT_PUBLIC_KEY, valueFrom: {secretKeyRef: {name: hsf-secrets, key: JWT_PUBLIC_KEY}}}
        - {name: JWT_PUBLIC_KEY_PREV, valueFrom: {secretKeyRef: {name: hsf-secrets, key: JWT_PUBLIC_KEY_PREV}}}
        - {name: JWT_KID_PREV, valueFrom: {secretKeyRef: {name: hsf-secrets, key: JWT_KID_PREV}}}
        # R-27（2026-11-14，docs/24 §4 R-27）：生产关闭 introspection——docs/05 §1.4 冻结口径
        # "内省 INTROSPECTION env 控制（dev 开/生产关）"的落地；gateway.js:101
        # `introspection: process.env.INTROSPECTION !== 'false'`（默认开启）→ 显式注入 false 后
        # __schema 查询被拒绝。演示环境口径（docs/24 R-27 实施记录）：hsf-dev 不注入本 env
        # （dev 派生清单无此行 → 默认开启，便于演示/调试）；E2E 25/25 不依赖 introspection（回归验证）
        - {name: INTROSPECTION, value: "false"}
        - name: SUBGRAPHS
          value: "iam=http://iam-svc.hsf-prod.svc.cluster.local:8091/graphql,land=http://land-svc.hsf-prod.svc.cluster.local:8092/graphql,project=http://project-svc.hsf-prod.svc.cluster.local:8093/graphql,facility=http://facility-svc.hsf-prod.svc.cluster.local:8094/graphql,rs=http://rs-svc.hsf-prod.svc.cluster.local:8098/graphql"
        # 二期限流改造（docs/07 §5.2/§5.3 env 冻结表）：判定移至 ratelimit-svc（Redis 固定窗口全局计数），
        # gw 只做 HTTP 调用 fail-open（非 200/网络错误/500ms 超时=放行+节流告警日志，同 key 60s 一条）
        - {name: RATE_MODE, value: "svc"}   # svc=调 ratelimit-svc（二期常态）；local=一期进程内桶回退开关
        - {name: RATE_SVC, value: "http://ratelimit-svc.hsf-prod.svc.cluster.local:8096"}
        - {name: RATE_CAP, value: "6000"}   # 仅 local 回退模式读取（进程内桶局部口径；一期重复键 1200/6000 已清理）
        resources: {requests: {cpu: 100m, memory: 384Mi}, limits: {cpu: "2", memory: 1Gi}}
        # R-21 startupProbe（docs/24 §4 R-21 验收②判据要求 gw 命中）：Node 网关启动快但组合
        # 子图列表初始化（SUBGRAPHS 5 子图 healthcheck）仍在 readiness 首个 5s 窗口内可见，
        # startupProbe 同探针口径 9090 /healthz（双探针指向 9090 口径不变——本行只是把该
        # /healthz 前移为启动门，60s 覆盖窗内 readiness/liveness 暂停，不改变原探针参数）
        startupProbe: {httpGet: {path: /healthz, port: 9090}, periodSeconds: 5, failureThreshold: 12}
        readinessProbe: {httpGet: {path: /healthz, port: 9090}, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /healthz, port: 9090}, initialDelaySeconds: 60, periodSeconds: 10}
---
# 注：gw-svc 不带 metrics:"true" label——Node 网关进程无 /metrics 端点（CONVENTIONS §2.16 例外），
#     避免被 ServiceMonitor 选中后 target 永远 DOWN；端口名仍为 http-metrics 以统一口径。
apiVersion: v1
kind: Service
metadata: {name: gw-svc, namespace: hsf-prod, labels: {app: gw-svc}}
spec:
  type: NodePort
  selector: {app: gw}
  ports: [{name: http-metrics, port: 8090, targetPort: 8090, nodePort: 30099}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: gw-hpa, namespace: hsf-prod}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: gw}
  minReplicas: 4
  maxReplicas: 6
  metrics:
  - type: Resource
    resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}
  # R-21（docs/24 §4 R-21 实施路径③）：scaleDown 稳定窗口 300s——对齐一期 HPA 扩容滞后长尾
  # 教训（docs/20 §3.4）：压测后负载骤降，缺省 scaleDown 稳定窗过短导致副本数抖动反复伸缩；
  # scaleUp 不设 stabilizationWindowSeconds（保持缺省 0s 快速扩容口径，仅抑制抖动方向）
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
# ─── iam：组织/账号/登录（联邦实体 Party 拥有者；种子幂等双守卫）───
apiVersion: apps/v1
kind: Deployment
metadata: {name: iam-svc, namespace: hsf-prod, labels: {app: iam-svc}}
spec:
  replicas: 2
  selector: {matchLabels: {app: iam-svc}}
  template:
    metadata: {labels: {app: iam-svc}}
    spec:
      priorityClassName: hsf-normal
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm: {topologyKey: kubernetes.io/hostname, labelSelector: {matchLabels: {app: iam-svc}}}
      containers:
      - name: app
        # R-31（2026-11-14，ADR-HSF-027）：issue_token 算法演进（JWT_ALG 开关）——1.0.2→1.0.3 patch；
        # JWT_ALG/JWT_PRIVATE_KEY/JWT_KID 经 envFrom(hsf-secrets) 注入（R-31 增键，HS256 默认）
        image: 10.167.2.175:30500/hsf/iam:1.0.3
        ports: [{containerPort: 8091}]
        envFrom: [{secretRef: {name: hsf-secrets}}]
        env:
        # R-06（2026-11-14）：SM4 字段加密显式注入（phone_enc 加解密消费方；envFrom 全量注入外的
        # 显式声明，防止 envFrom 漏配静默回退——crypto.py fail-closed 缺失即启动失败）
        - {name: SM4_FIELD_KEY, valueFrom: {secretKeyRef: {name: hsf-secrets, key: SM4_FIELD_KEY}}}
        resources: {requests: {cpu: 150m, memory: 256Mi}, limits: {cpu: "1", memory: 512Mi}}
        # R-21 startupProbe（docs/24 §4 R-21 实施路径②）：Python+DB 连接池初始化慢启动，
        # /healthz（不依赖 DB，CONVENTIONS §2.14）覆盖窗 5s×12=60s；窗口内 readiness/liveness
        # 暂停生效，超窗未通过则按启动失败重启（不再依赖 liveness initialDelay 兜底）
        startupProbe: {httpGet: {path: /healthz, port: 8091}, periodSeconds: 5, failureThreshold: 12}
        readinessProbe: {httpGet: {path: /readyz, port: 8091}, periodSeconds: 5, failureThreshold: 3}
        livenessProbe: {httpGet: {path: /healthz, port: 8091}, initialDelaySeconds: 20, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: iam-svc, namespace: hsf-prod, labels: {app: iam-svc, metrics: "true"}}
spec: {selector: {app: iam-svc}, ports: [{name: http-metrics, port: 8091, targetPort: 8091}]}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: iam-hpa, namespace: hsf-prod}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: iam-svc}
  minReplicas: 2
  maxReplicas: 4
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}}]
  # R-21：scaleDown 稳定窗口 300s（口径同 gw-hpa，docs/20 §3.4 一期教训）
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
