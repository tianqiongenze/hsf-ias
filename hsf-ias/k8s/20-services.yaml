metadata: {name: iam-hpa, namespace: hsf-prod}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: iam-svc}
  minReplicas: 2
  maxReplicas: 4
  metrics: [{type: Resource, resource: {name: cpu, target: {type: Utilization, averageUtilization: 60}}}]
