# HSF 二期 MQTT Broker：Mosquitto（StatefulSet 1 副本，命名空间 hsf-prod）
# 依据：docs/07 §2（冻结 topic/payload/QoS/认证）、§1.3（资源核算）、CONVENTIONS-P2 T-2/T-3
# 镜像：eclipse-mosquitto:2.1 → 本地仓库 base/mosquitto:2.1
# 认证（docs/07 §2.4 冻结）：明文 1883（ClusterIP 不出网，A-07-1）+ 密码认证 + ACL，不做 TLS；
#   单账号 hsf，密码=Secret hsf-secrets/MQTT_PASS，由 initContainer 以 mosquitto_passwd 写入
#   PVC（幂等覆盖，密码不落 ConfigMap）；sim 只 pub、iot 只 sub，单一 readwrite 账号即可
# 调度：nodeSelector 固定 worker1（T-3）；hsf-dev 同构 sed 's/hsf-prod/hsf-dev/g' 另行 apply
---
apiVersion: v1
kind: ConfigMap
metadata: {name: mosquitto-config, namespace: hsf-prod}
data:
  mosquitto.conf: |
    # docs/07 §2.4 冻结值——逐项对应，勿手改
    listener 1883 0.0.0.0
    allow_anonymous false
    password_file /mosquitto/data/passwd
    # acl_file 指向 PVC 路径（passwd-init 拷贝并 chown 1883）：mosquitto 2.1.2 实测对
    # password/acl 等敏感文件校验"属主=运行用户"——ConfigMap 投影文件属 root，直接挂载
    # 必然 "Error: Unable to open acl_file"（2026-11-08 部署实测，exit 13 CrashLoop）
    acl_file /mosquitto/data/acl
    persistence true
    persistence_location /mosquitto/data/
    max_queued_messages 10000
    max_inflight_messages 100
  acl: |
    # sim 发布（pub）/iot 订阅（sub）共用 hsf 账号；下行 topic hsf/cmd/# 三期再放
    user hsf
    topic readwrite hsf/sensor/#
---
apiVersion: v1
kind: Service
metadata: {name: hsf-mqtt, namespace: hsf-prod, labels: {app: hsf-mosquitto}}
spec:
  type: ClusterIP          # T-2：不暴露 NodePort（不出集群网）
  selector: {app: hsf-mosquitto}
  # 端口名不用 http-metrics：无 HTTP /metrics 端点，不带 metrics:"true" label（CONVENTIONS §2.16 例外逻辑）
  ports: [{name: mqtt, port: 1883, targetPort: 1883}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: hsf-mosquitto, namespace: hsf-prod, labels: {app: hsf-mosquitto}}
spec:
  serviceName: hsf-mqtt
  replicas: 1
  selector: {matchLabels: {app: hsf-mosquitto}}
  template:
    metadata: {labels: {app: hsf-mosquitto}}
    spec:
      priorityClassName: hsf-normal
      nodeSelector: {kubernetes.io/hostname: k8s-worker1}   # T-3：master requests 满，只允许 worker1
      initContainers:
      # 密码文件初始化：mosquitto_passwd -b -c 幂等覆盖重建（docs/07 §2.4）；chown 给运行时 uid 1883
      # （mosquitto 以 root 启动后自降权到 mosquitto 用户，PVC 目录属 root 则持久化写失败）
      - name: passwd-init
        image: 10.167.2.175:30500/base/mosquitto:2.1
        command: ["/bin/sh", "-c"]
        args:
        - |
          mkdir -p /mosquitto/data
          mosquitto_passwd -b -c /mosquitto/data/passwd hsf "$MQTT_PASS"
          # acl 同拷入 PVC：见 mosquitto.conf 注释——2.1.2 敏感文件属主校验，ConfigMap
          # 直挂（root 属主）不可读；init 每次启动重拷，ConfigMap 变更重启 pod 即生效
          cp /mosquitto/config/acl /mosquitto/data/acl
          chown -R 1883:1883 /mosquitto/data
        securityContext: {runAsUser: 0}
        env:
        - {name: MQTT_PASS, valueFrom: {secretKeyRef: {name: hsf-secrets, key: MQTT_PASS}}}
        volumeMounts:
        - {name: data, mountPath: /mosquitto/data}
        - {name: config, mountPath: /mosquitto/config}   # 只读源：acl 拷贝进 PVC（上）
      containers:
      - name: mosquitto
        image: 10.167.2.175:30500/base/mosquitto:2.1
        # 不覆盖 command：镜像入口默认 exec `mosquitto -c /mosquitto/config/mosquitto.conf`
        # （config 由 ConfigMap 挂载覆盖，见 volumes）
        ports: [{containerPort: 1883}]
        resources: {requests: {cpu: 100m, memory: 128Mi}, limits: {cpu: 500m, memory: 256Mi}}   # docs/07 §1.3
        readinessProbe: {tcpSocket: {port: 1883}, initialDelaySeconds: 5, periodSeconds: 5}
        livenessProbe: {tcpSocket: {port: 1883}, initialDelaySeconds: 15, periodSeconds: 10}
        volumeMounts:
        - {name: config, mountPath: /mosquitto/config}
        - {name: data, mountPath: /mosquitto/data}   # 持久化：QoS1 会话与离线补投队列重启保留（§2.3）
      volumes:
      - name: config
        configMap: {name: mosquitto-config}
  volumeClaimTemplates:
  - metadata: {name: data}
    spec:
      accessModes: [ReadWriteOnce]
      storageClassName: local-path
      resources: {requests: {storage: 1Gi}}   # docs/07 §2.4：PVC 1Gi（会话/队列/密码文件，量小）
