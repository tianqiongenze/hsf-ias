# HSF 基础层：命名空间、ResourceQuota、LimitRange、PriorityClass、Secret
# 依据：CONVENTIONS.md §1/§2.15/§2.17/§2.18、hsf/docs/04 §3.0(三库双账号)/§7.3(Secret 键名冻结)、hsf/docs/06 §8.2
# R-07（2026-11-14）：密钥真值出库——本文件不含任何真实密钥，部署期 scripts/gen-secrets.sh 注入（见 Secret 块注释）
---
apiVersion: v1
kind: Namespace
metadata:
  name: hsf-dev
---
apiVersion: v1
kind: Namespace
metadata:
  name: hsf-prod
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: hsf-critical
value: 1000000
description: HSF 核心链路（网关 gw）
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: hsf-normal
value: 800000
description: HSF 常规业务（四子图/web）
---
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: hsf-batch
value: 400000
description: HSF 批处理/模拟与压测（sim/k6/Job，资源紧张可让位）
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hsf-prod-quota
  namespace: hsf-prod
spec:
  hard:
    requests.cpu: "12"        # CONVENTIONS §2.15 冻结值；基础负载仅占 ~19%（06 号 §8.2），余量给 HPA/压测 Job
    requests.memory: 24Gi
    limits.cpu: "36"          # W-2（docs/08 §5，CONVENTIONS-P3）：32→36——三期 rs(1C)+uplink(0.5C) limits 增量；当前 used≈26.5C，36 上限仍留 ≥9C 给其他租户。范围仅本命名空间（hsf-dev-quota 维持 32，§2.15 冻结值）
    limits.memory: 48Gi       # CONVENTIONS §2.15 冻结值
    persistentvolumeclaims: "10"
    pods: "60"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: hsf-prod-limits
  namespace: hsf-prod
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 500m
      memory: 512Mi
    max:
      cpu: "4"
      memory: 6Gi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: hsf-dev-quota
  namespace: hsf-dev
spec:
  hard:
    requests.cpu: "12"        # dev 与 prod 同配额池（02 号 §5.1：同构、副本减半）
    requests.memory: 24Gi
    limits.cpu: "32"          # W-2 范围=仅 hsf-prod-quota（docs/08 §5，CONVENTIONS-P3）：dev 未部署三期新增服务，维持 CONVENTIONS §2.15 冻结值 32——勿同步上调（45C 集群 prod+dev limits 双计未评估；2026-11-13 评审修订回退）
    limits.memory: 48Gi
    pods: "60"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: hsf-dev-limits
  namespace: hsf-dev
spec:
  limits:
  - type: Container
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    default:
      cpu: 500m
      memory: 512Mi
    max:
      cpu: "4"
      memory: 6Gi
---
# Secret hsf-secrets（键名冻结：hsf/docs/04 §7.3、hsf/docs/07 §1.4；R-06 增 SM4_FIELD_KEY）
# 账号口径（CONVENTIONS §1/§3.2）：hsf_app=三库读写(write_pool) / hsf_ro=三库只读(read_pool)
# 双连接池 host 均为 tidb.infra.svc.cluster.local:4000——不存在任何只读别名主机名（CONVENTIONS §0/§2.9）
# R-07（2026-11-14）真值出库：密钥值不再入 manifest——本文件密钥键=空占位符（应用 fail-closed 校验
#   拒空启动：web.py JWT_SECRET 非空断言 / crypto.py SM4 长度断言 / gw JWT_SECRET 非空断言），
#   部署期由 scripts/gen-secrets.sh 在部署机生成 CSPRNG 真值后覆盖（gen/ 产物不入 git）。
#   部署顺序：00-base.yaml → 10-redis.yaml → scripts/gen-secrets.sh（覆盖三处 Secret）→ 20-services.yaml。
# 分值口径（R-07）：JWT_SECRET prod/dev 强制分值；DB_*/REDIS_*/MQTT_*/TIMESCALE_* 为共享单实例
#   （TiDB/hsf-redis/hsf-mqtt/hsf-timescale 各一套）两命名空间同值——组件级分值需独立实例，显式声明。
apiVersion: v1
kind: Secret
metadata:
  name: hsf-secrets
  namespace: hsf-prod
type: Opaque
stringData:
  DB_HOST_WRITE: tidb.infra.svc.cluster.local:4000
  DB_HOST_READ: tidb.infra.svc.cluster.local:4000
  DB_USER: hsf_app
  DB_USER_RO: hsf_ro
  DB_PASS: ""
  DB_PASS_RO: ""
  REDIS_URL: hsf-redis-0.hsf-redis-h.infra.svc.cluster.local:6379,hsf-redis-1.hsf-redis-h.infra.svc.cluster.local:6379,hsf-redis-2.hsf-redis-h.infra.svc.cluster.local:6379
  REDIS_PASS: ""
  # 二期增键（docs/07 §1.4 冻结，两命名空间同步）：MQTT_PASS=mosquitto 运维账号 hsf（R-20/ADR-HSF-018
  #   语义收窄：回退开关保留，sim/iot 改分账号键 MQTT_PASS_SIM/MQTT_PASS_IOT）；
  # TIMESCALE_PASS=hsf-timescale(POSTGRES_PASSWORD)/iot(TIMESCALE_DSN)/init-ts.sh 三方共用同一键；
  # R-06 增键：SM4_FIELD_KEY=字段加密密钥（iam/facility 消费，crypto.py fail-closed 校验 32 字节 hex）
  MQTT_PASS: ""
  MQTT_PASS_SIM: ""   # R-20 增键（2026-11-14，ADR-HSF-018）：sim 发布账号 hsf-sim
  MQTT_PASS_IOT: ""   # R-20 增键（2026-11-14，ADR-HSF-018）：iot 订阅账号 hsf-iot
  TIMESCALE_PASS: ""
  JWT_SECRET: ""
  # R-31 增键（2026-11-14，ADR-HSF-027）：JWT 签名演进——JWT_ALG=HS256 默认（冻结兼容开关，
  # 切 RS256 仅改本键值滚动）；JWT_PRIVATE_KEY=签发方 iam 私钥（base64(PEM) 单行）；
  # JWT_PUBLIC_KEY=gw/REST 验签公钥（base64(PEM)）；*_PREV=轮换期旧公钥/kid（可空）；
  # JWT_KID=令牌头 kid（gen-secrets.sh RSA-2048 生成，prod/dev 分值）
  JWT_ALG: "HS256"
  JWT_KID: ""
  JWT_PRIVATE_KEY: ""
  JWT_PUBLIC_KEY: ""
  JWT_PUBLIC_KEY_PREV: ""
  JWT_KID_PREV: ""
  SM4_FIELD_KEY: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: hsf-secrets
  namespace: hsf-dev
type: Opaque
stringData:
  DB_HOST_WRITE: tidb.infra.svc.cluster.local:4000
  DB_HOST_READ: tidb.infra.svc.cluster.local:4000
  DB_USER: hsf_app
  DB_USER_RO: hsf_ro
  DB_PASS: ""
  DB_PASS_RO: ""
  REDIS_URL: hsf-redis-0.hsf-redis-h.infra.svc.cluster.local:6379,hsf-redis-1.hsf-redis-h.infra.svc.cluster.local:6379,hsf-redis-2.hsf-redis-h.infra.svc.cluster.local:6379
  REDIS_PASS: ""
  MQTT_PASS: ""
  MQTT_PASS_SIM: ""   # R-20 增键（2026-11-14，ADR-HSF-018）
  MQTT_PASS_IOT: ""   # R-20 增键（2026-11-14，ADR-HSF-018）
  TIMESCALE_PASS: ""
  JWT_SECRET: ""   # R-07：prod/dev 强制分值（gen-secrets.sh 分别生成）
  JWT_ALG: "HS256"   # R-31：冻结兼容开关（切换 RS256 仅改本键值+滚动，ADR-HSF-027）
  JWT_KID: ""
  JWT_PRIVATE_KEY: ""
  JWT_PUBLIC_KEY: ""
  JWT_PUBLIC_KEY_PREV: ""
  JWT_KID_PREV: ""
  SM4_FIELD_KEY: ""
---
# 默认拒绝入站；放行同命名空间、监控(Prometheus 抓取)、infra(Redis/TiDB 回包方向不收 ingress 限制)
# 对齐 DV-IAS k8s/00-base.yaml 同名策略
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-allow-inner
  namespace: hsf-prod
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
  - from:
    - podSelector: {}
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: infra
  # NodePort 场景（CONVENTIONS §1：NodePort 必须局域网可达）：eTP=Cluster 下跨节点转发流量
  # 经 kube-proxy MASQ/内核选源后源为 192.168.235.231 这类 calico 隧道地址（ip route get 实测），
  # LAN 客户端源为 10.167.x——pod 源选择器均无法匹配，不放行则 NodePort 请求被本策略静默丢弃
  # （2026-11-07 部署实测定位：cali-tw "Drop if no policies passed" 100% 丢包点）。
  - from:
    - ipBlock: {cidr: 10.167.0.0/16}
  - from:
    - ipBlock: {cidr: 192.168.0.0/16}
