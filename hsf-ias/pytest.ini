[pytest]
# 全量单测（python -m pytest hsf-ias/services -q）跨服务同进程收集：facility/iam/land/project
# 四服务同名 tests/test_domain.py、iot/sim 同名 test_rules.py——默认 prepend 模式以 basename 作
# 模块名，第二个同名文件必然 import file mismatch；importlib 模式按 rootdir 相对路径生成唯一
# 模块名（services.<svc>.tests.<name>），同名文件各服务独立收集。
# 配合各服务 tests/conftest.py 的 pytest_collectstart（钉本服务根 + 清非本服务 app* 缓存）
# 防同名 app 包跨服务串包（rs/uplink conftest 既有口径推广至全服务）。
addopts = --import-mode=importlib
